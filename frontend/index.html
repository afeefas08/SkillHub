<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Path Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <div class="d-flex min-vh-100">
        <!-- SIDEBAR -->
        <aside class="sidebar position-fixed top-0 start-0 vh-100 d-flex flex-column">

            <!-- Logo -->
            <div class="px-3 py-4">
                <div class="d-flex align-items-center gap-2">
                    <div class="logo-icon">
                        <i class="bi bi-mortarboard-fill"></i>
                    </div>
                    <span class="text-white fw-semibold">
                        SkillHub
                    </span>
                </div>
            </div>


            <!-- Navigation -->
            <nav class="px-2 mt-3">
                <a href="#" class="sidebar-link active">
                    <i class="bi bi-grid-1x2-fill"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="sidebar-link">
                    <i class="bi bi-book"></i>
                    <span>Modules</span>
                </a>
                <a href="#" class="sidebar-link">
                    <i class="bi bi-journal-check"></i>
                    <span>My Path</span>
                </a>
                <a href="#" class="sidebar-link">
                    <i class="bi bi-bar-chart"></i>
                    <span>Progress</span>
                </a>
            </nav>

            <!-- Bottom -->
            <div class="mt-auto px-2 pb-4">
                <a href="#" class="sidebar-link">
                    <i class="bi bi-gear"></i>
                    <span>Settings</span>
                </a>
            </div>

        </aside>

        <div class="dashboard-content">
            <div class="row g-0 min-vh-100">
                <!--  MODULES -->
                <main class="col-md-6 available-section">

                    <!-- Header -->
                    <header class="px-4 px-lg-5 py-2 border-bottom">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h1 class="h3 fw-bold mb0">Courses</h1>
                                <p class="text-secondary mb-0">Explore modules and build your learning path.</p>
                            </div>
                        </div>
                    </header>

                    <!-- Modules -->
                    <section class="p-4 p-lg-5">

                        <!-- Alert -->
                        <div id="alert-container"></div>
                        <!-- Module container -->
                        <div id="modules-container">
                            <div class="card module-card border-0 rounded-4 mb-3"></div>
                        </div>

                    </section>

                </main>


                <!-- MY LEARNING PATH -->

                <aside class=" col-md-6 path-section">

                    <header class="px-4 px-lg-5 py-3 border-bottom">
                        <div class="d-flex justify-content-between align-items-end">
                            <div>
                                <h2 class="h4 fw-bold mb-0">My Learning Path</h2>
                                <p class="text-secondary small mb-0">
                                    Your selected modules
                                </p>

                            </div>
                            <div class="student-profile">
                                <div class="student-avatar">A</div>
                                <div class="d-none d-lg-block"></div>
                            </div>
                        </div>

                    </header>

                    <section class="p-4 p-lg-5">
                        <div id="selected-container">
                            <div id="empty-message" class="text-center py-5">
                                <div class="empty-icon mx-auto mb-3">
                                    <i class="bi bi-journal-plus"></i>
                                </div>

                                <h3 class="h6 fw-semibold">Your learning path is empty</h3>
                                <p class="text-secondary small mb-0">Add modules from the left to startbuilding your path.</p>
                            </div>
                            <div id="selected-items"></div>
                        </div>

                        <button id="save-path" class="btn btn-primary w-100 rounded-3 py-2 mt-3 fw-semibold">
                            Save Learning Path
                        </button>
                    </section>
                </aside>
            </div>
        </div>


    </div>


    <script src="app.js"></script>

</body>

</html>F
